# Runs the Marginalia server (app + sync storage). From the repo root:
#   docker compose -f deploy/docker-compose.yml up -d
# Then open http://localhost:8095, or point a Cloudflare tunnel at HOST_IP:8095.
#
# Relative paths resolve from this deploy/ folder. TrueNAS "Install via YAML"
# needs absolute paths instead; see the README.
services:
  marginalia:
    image: python:3.12-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-u", "serve.py", "--host", "0.0.0.0", "--port", "8095", "--data", "/data", "--no-open"]
    environment:
      MARGINALIA_TOKEN: ""   # optional: set a long random value to require it in every browser
    ports:
      - "8095:8095"
    volumes:
      - ..:/app:ro      # the app code (read-only)
      - ./data:/data    # notes database and PDFs; back this up
