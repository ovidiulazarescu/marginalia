# Serves Marginalia with nginx. From the repo root:
#   docker compose -f deploy/docker-compose.yml up -d
# Then open http://localhost:8095 (or point a Cloudflare tunnel at HOST_IP:8095).
#
# Relative paths resolve from this deploy/ folder. TrueNAS "Install via YAML"
# needs absolute paths instead; see the README.
services:
  marginalia:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8095:80"
    volumes:
      - ..:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
