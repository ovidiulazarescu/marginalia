# nginx config for serving Marginalia as static files (e.g. nginx:alpine on TrueNAS).
# Mount as /etc/nginx/conf.d/default.conf and the repo as /usr/share/nginx/html.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Never serve .git, .gitignore or other dotfiles.
  location ~ /\. { deny all; }

  # File names are not versioned, so browsers must revalidate to pick up updates.
  location ~* \.(html|js|css)$ { add_header Cache-Control "no-cache"; }
}
